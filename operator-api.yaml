openapi: 3.0.3
info:
  title: Operator API
  description: |
    API для веб-интерфейса диспетчера.

    **Версионирование:** не требуется — веб-клиент всегда на актуальной версии.

    **Аутентификация:** JWT в httpOnly cookie.

    **Ошибки инфраструктуры:** API Gateway может вернуть `502` / `503`
    при недоступности backend-сервисов (не описаны в spec — уровень инфраструктуры).
  version: 1.0.0

servers:
  - url: /api/operator

security:
  - CookieAuth: []

tags:
  - name: Map
    description: Карта с курьерами
  - name: Couriers
    description: Профили курьеров
  - name: Tracks
    description: Смены и треки
  - name: "Orders (Stage 2)"
    description: Заказы — привязка треков к заказам (этап 2)

paths:
  /map/couriers:
    get:
      tags: [Map]
      summary: Курьеры в области карты
      description: |
        Возвращает курьеров в bounding box (viewport карты).
        Диспетчер делает polling каждые 5 секунд.
        Источник данных — Redis Geo (GEOSEARCH).
      parameters:
        - name: lat1
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Широта юго-западного угла
          example: 55.55
        - name: lng1
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Долгота юго-западного угла
          example: 37.35
        - name: lat2
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Широта северо-восточного угла
          example: 55.95
        - name: lng2
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Долгота северо-восточного угла
          example: 37.85
      responses:
        "200":
          description: Список курьеров с позициями
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierPosition"
        "400":
          description: "Невалидные координаты (lat1 > lat2, значения вне диапазона)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /couriers:
    get:
      tags: [Couriers]
      summary: Список курьеров
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline]
          description: "Фильтр по статусу (online = есть незакрытая смена)"
      responses:
        "200":
          description: Список курьеров
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourierSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /couriers/{courierId}:
    get:
      tags: [Couriers]
      summary: Профиль курьера
      parameters:
        - $ref: "#/components/parameters/CourierId"
      responses:
        "200":
          description: Данные курьера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Курьер не найден

  /couriers/{courierId}/shifts:
    get:
      tags: [Tracks]
      summary: Смены курьера
      parameters:
        - $ref: "#/components/parameters/CourierId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          example: "2026-01-31"
      responses:
        "200":
          description: Список смен
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Курьер не найден

  /couriers/{courierId}/shifts/{shiftId}:
    get:
      tags: [Tracks]
      summary: Детали смены
      parameters:
        - $ref: "#/components/parameters/CourierId"
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Данные смены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Смена не найдена

  /shifts/{shiftId}/locations:
    get:
      tags: [Tracks]
      summary: Трек смены
      description: |
        Массив GPS-точек за смену (до ~5 000 точек, ~380 КБ).
        Пагинация не требуется — отдаём весь трек одним ответом.

        Роутинг по дате:
        - < 1 месяца — PostgreSQL (hot)
        - 1–12 месяцев — BigQuery (cold)

        Завершённые треки кэшируются в Redis (TTL 1 день).
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Массив GPS-точек
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Смена не найдена

  /shifts/{shiftId}/orders:
    get:
      tags: ["Orders (Stage 2)"]
      summary: Заказы в смене
      description: Список заказов, выполненных в рамках смены. orderId из внешней системы заказов.
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Смена не найдена

  /orders/{orderId}:
    get:
      tags: ["Orders (Stage 2)"]
      summary: Детали заказа
      description: orderId глобально уникален (из внешней системы заказов).
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Данные заказа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Заказ не найден

  /orders/{orderId}/locations:
    get:
      tags: ["Orders (Stage 2)"]
      summary: Трек заказа
      description: |
        Участок маршрута за время выполнения заказа (до ~1 080 точек, ~81 КБ).
        Пагинация не требуется.

        Реализация: фильтрация locations по `courierId + timestamp BETWEEN orders.startedAt AND orders.endedAt`.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Массив GPS-точек за время заказа
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Заказ не найден

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: JWT в httpOnly cookie. Устанавливается при логине диспетчера.

  parameters:
    CourierId:
      name: courierId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
      example: 42

    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
      example: 1001

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
      example: 20

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      example: 0

  schemas:
    Location:
      type: object
      properties:
        lat:
          type: number
          format: double
          example: 55.7558
        lng:
          type: number
          format: double
          example: 37.6173
        timestamp:
          type: string
          format: date-time
          example: "2026-01-15T10:05:30+03:00"

    CourierPosition:
      type: object
      properties:
        courierId:
          type: integer
          example: 1
        lat:
          type: number
          format: double
          example: 55.7558
        lng:
          type: number
          format: double
          example: 37.6173
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-15T10:05:30+03:00"

    CourierSummary:
      type: object
      properties:
        courierId:
          type: integer
          example: 1
        firstName:
          type: string
          example: "Иван"
        lastName:
          type: string
          example: "Иванов"
        status:
          type: string
          enum: [online, offline]

    Courier:
      type: object
      properties:
        courierId:
          type: integer
          example: 1
        firstName:
          type: string
          example: "Иван"
        lastName:
          type: string
          example: "Иванов"
        status:
          type: string
          enum: [online, offline]

    Shift:
      type: object
      properties:
        shiftId:
          type: integer
          example: 42
        courierId:
          type: integer
          example: 1
        startedAt:
          type: string
          format: date-time
          example: "2026-01-15T09:00:00+03:00"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T21:00:00+03:00"

    OrderSummary:
      type: object
      properties:
        orderId:
          type: integer
          example: 1001
        startedAt:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+03:00"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T10:45:00+03:00"

    Order:
      type: object
      properties:
        orderId:
          type: integer
          example: 1001
        shiftId:
          type: integer
          example: 42
        courierId:
          type: integer
          example: 1
        startedAt:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00+03:00"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-15T10:45:00+03:00"

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          description: Общее количество записей
          example: 150
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    Error:
      type: object
      properties:
        error:
          type: string
          example: "invalid coordinates"

  responses:
    Unauthorized:
      description: Невалидная или просроченная сессия
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
